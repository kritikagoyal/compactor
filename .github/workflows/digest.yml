name: Daily Systems Digest

on:
  schedule:
    # Test trigger for IST timezone:
    # 07:40, 07:45, 07:50 UTC = 13:10, 13:15, 13:20 IST
    - cron: '00 2 * * *'
  workflow_dispatch:     # Allows manual trigger via GitHub Actions UI

permissions:
  contents: write       # Required to commit and push digests back to repository

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Compactor Engine
        run: python main.py

      - name: Commit and push daily report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add report/ INDEX.md state/
          git diff --staged --quiet || (git commit -m "chore(digest): automated daily digest [skip ci]" && git push)
